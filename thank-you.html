<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Hobbs Homes, Missoula MT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --maroon: #70002E;
    --maroon-dark: #4F0020;
    --black: #1A1A1A;
    --cream: #FCFBF4;
    --stone: #F0EDE1;
    --stone-line: #DEDACB;
    --text-soft: #4A4740;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Work Sans', sans-serif;
    background: var(--cream);
    color: var(--black);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  h1, h2 { font-family: 'Playfair Display', serif; font-weight: 500; line-height: 1.15; }
  a { text-decoration: none; color: inherit; }
  img { display: block; max-width: 100%; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 40px; }

  header {
    display: flex;
    justify-content: center;
    padding: 36px 40px;
  }
  header img.logo { height: 46px; }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
  }
  .confirm { max-width: 540px; }
  .confirm .mark {
    width: 56px; height: 56px;
    border: 1px solid var(--maroon);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 28px;
    color: var(--maroon);
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 26px;
  }
  .confirm h1 { font-size: 36px; margin-bottom: 18px; }
  .confirm p.lead { font-size: 18px; color: var(--text-soft); margin-bottom: 8px; }
  .confirm p.sub { font-size: 15.5px; color: var(--text-soft); margin-bottom: 36px; }
  .confirm .contact-row {
    display: flex; gap: 14px; justify-content: center;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }
  .confirm .contact-row a {
    font-size: 14.5px;
    border: 1px solid var(--stone-line);
    padding: 10px 20px;
    border-radius: 2px;
    color: var(--black);
  }
  .confirm .contact-row a:hover { border-color: var(--maroon); color: var(--maroon); }
  .btn {
    display: inline-block;
    padding: 15px 30px;
    font-size: 15px;
    letter-spacing: 0.02em;
    border-radius: 2px;
    background: var(--maroon);
    color: #fff;
    border: 1px solid var(--maroon);
    transition: background 0.2s;
  }
  .btn:hover { background: var(--maroon-dark); }

  footer {
    text-align: center;
    padding: 28px 40px;
    font-size: 13px;
    color: var(--text-soft);
  }

  @media (max-width: 600px) {
    .confirm h1 { font-size: 28px; }
  }

  .brand { display:flex; align-items:center; gap:18px; }
  .brand a { display:flex; }
  .brand-div { width:1px; height:34px; background:#cfcabb; }
  header img.kw-logo { height:36px; width:auto; }
  img.kw-logo-f { height:34px; width:auto; display:block; margin-top:22px; opacity:.9; }
  @media (max-width: 860px) { header img.kw-logo { height:24px; } .brand { gap:12px; } .brand-div { height:24px; } }

  /* centered header */
  header { display:block; width:100%; box-sizing:border-box; max-width:1180px; margin:0 auto; padding:22px 40px 0; }
  .hdr-top { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; }
  .hdr-kw { justify-self:start; display:flex; }
  .hdr-logo { display:flex; }
  .hdr-cta { justify-self:end; }
  header img.logo { height:56px; width:auto; }
  header img.kw-logo { height:34px; width:auto; }
  header nav { display:flex; justify-content:center; align-items:center; gap:40px; flex-wrap:nowrap; margin-top:20px; padding:16px 0 18px; border-top:1px solid #e3ddcc; }
  header nav a { white-space:nowrap; }
  .hdr-cta.nav-phone { white-space:nowrap; font-size:16px; padding:9px 20px; }
  @media (max-width:860px) {
    header { padding:16px 20px 0; }
    header img.logo { height:40px; }
    header img.kw-logo { height:22px; }
    .hdr-cta.nav-phone { display:none; }
    header nav { display:flex; justify-content:flex-start; gap:22px; overflow-x:auto; margin-top:14px; padding:12px 0; }
  }
</style>
</head>
